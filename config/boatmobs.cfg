# Configuration file

general {
    # Allow mobs to dismount a boat once they can walk to their target.
    B:allowDismountToWalk=true

    # When true, hostile mobs sharing a boat with a player can melee-attack them.
    B:allowSharedBoatAttack=true

    # How many blocks away a mob will look for a free boat to board (default 24).
    # Min: 4
    # Max: 64
    I:boatSearchRadius=24

    # When true, a mob holding a boat item in either hand is treated as if it were on the spawnBoatMobList. The spawned boat matches the wood type of the held boat item.
    B:heldBoatSpawnsBoat=true

    # List of mob resource locations for the whitelist/blacklist.
    S:mobList <
        minecraft:zombie
        minecraft:zombie_villager
        minecraft:husk
        minecraft:skeleton
        minecraft:stray
        minecraft:wither_skeleton
        minecraft:creeper
        minecraft:spider
        minecraft:cave_spider
        minecraft:witch
        minecraft:vindicator
        minecraft:illusioner
        minecraft:evoker
        minecraft:slime
        minecraft:magma_cube
        minecraft:silverfish
        minecraft:endermite
        minecraft:cow
        minecraft:mooshroom
        minecraft:sheep
        minecraft:pig
        minecraft:chicken
        minecraft:horse
        minecraft:donkey
        minecraft:mule
        minecraft:llama
        minecraft:wolf
        minecraft:ocelot
        minecraft:rabbit
        minecraft:villager
        minecraft:iron_golem
        minecraft:snowman
     >

    # When true, only mobs listed in 'mobList' can use boats (whitelist mode).
    B:mobListIsWhitelist=true

    # Cooldown in ticks between shared-boat melee attacks (default 20).
    # Min: 1
    # Max: 200
    I:sharedBoatAttackCooldown=20

    # How many blocks from the target a mob will scan for a walkable shore to steer toward (default 8).
    # Min: 2
    # Max: 32
    I:shoreSearchRadius=8

    # Mobs listed here will spawn their own temporary boat when pursuing a target on water. The spawned boat is removed when the mob dismounts. Mobs NOT in this list but in 'mobList' use the normal find-existing-boat behaviour. Format: 'mob_id' or 'mob_id=boat_type'. Valid boat types: oak, spruce, birch, jungle, acacia, dark_oak. Defaults to oak if no type is specified.
    S:spawnBoatMobList <
        minecraft:villager
     >
}


