# Configuration file

~CONFIG_VERSION: 0.4.0

##########################################################################################################
# advanced
#--------------------------------------------------------------------------------------------------------#
# Розширені параметри конфігурації, щоб змінити спосіб функціонування JEI.
##########################################################################################################

advanced {
    # Якщо значення true, нові закладки додаються на початок списку. Якщо false, нові закладки додаються в кінець списку [default: true]
    B:addBookmarksToFront=false

    # Перемістити поле пошуку JEI знизу по центру екрану. [default: false]
    B:centerSearchBarEnabled=true
    B:debugModeEnabled=false

    # Чи має JEI давати предмети безпосередньо в інвентар чи підбирати їх за допомогою миші.
    # [Типово: mouse_pickup]
    # [Дійсний: [inventory, mouse_pickup]]
    S:giveMode=MOUSE_PICKUP

    # Приховує список інгредієнтів, доки не введено пошук. Поле пошуку лишається доступним. [default: false]
    B:hideIngredientsWhenNotSearching=false

    # Максимальна ширина накладання списків предметів і закладок. [range: 2 ~ 100, default: 9]
    I:maxColumns=40

    # Максимальна висота інтерфейсу рецептів. [range: 175 ~ 5000, default: 350]
    I:maxRecipeGuiHeight=175

    # Як має показуватися назва мода в підказці інтерфейсу JEI. Залиште порожнім, щоб вимкнути. [Типово: blue italic] [Дійсний: [black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white, obfuscated, bold, strikethrough, underline, italic]]
    S:modNameFormat=blue italic

    # Увімкнути оптимізації використання пам'яті JEI. [default: true]
    B:optimizeMemoryUsage=true
}


##########################################################################################################
# search
#--------------------------------------------------------------------------------------------------------#
# Параметри, що пов’язані з полем пошуку.
##########################################################################################################

search {
    # Режим пошуку за кольорами (префікс: ^).
    # [Типово: disabled]
    # [Дійсний: [enabled, require_prefix, disabled]]
    S:colorSearchMode=DISABLED

    # Режим пошуку за назвами творчих вкладок (префікс: %).
    # [Типово: disabled]
    # [Дійсний: [enabled, require_prefix, disabled]]
    S:creativeTabSearchMode=DISABLED

    # Режим пошуку за назвами модів (префікс: @).
    # [Типово: require_prefix]
    # [Дійсний: [enabled, require_prefix, disabled]]
    S:modNameSearchMode=enabled

    # Режим пошуку за іменем в словнику руд (префікс: $).
    # [Типово: disabled]
    # [Дійсний: [enabled, require_prefix, disabled]]
    S:oreDictSearchMode=DISABLED

    # Режим пошуку за ідентифікатором ресурів (префікс: &).
    # [Типово: disabled]
    # [Дійсний: [enabled, require_prefix, disabled]]
    S:resourceIdSearchMode=enabled

    # Шукати в розширених підказках (видно за F3 + H). [default: false]
    B:searchAdvancedTooltips=false

    # Режим пошуку за підказками (префікс: #).
    # [Типово: enabled]
    # [Дійсний: [enabled, require_prefix, disabled]]
    S:tooltipSearchMode=ENABLED
}


