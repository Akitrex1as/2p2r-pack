# Configuration file

general {
    # Вносить виміри до чорного списку сканування профілювання JEI
    I:dimensionsBlacklist <
        -11
     >

    # Вбудований код сумісності не завантажуватиметься, і будуть завантажені json-файли (потрібен перезапуск MC)
    B:diyData=true

    # Вносить зачарування до чорного списку у вигляді зачарувань JEI
    S:enchantsBlacklist <
        flimflam
        soulBound
     >

    # Вкладки, додані JER, це 'підземелля', 'зачарування', 'моб', 'селянин', 'світоген' і 'рослина'
    S:hiddenTabs <
        dungeon
     >

    # Змінює кількість предметів на стовпець у вигляді підземель та мобів JEI
    I:itemsPerColumn=4

    # Змінює кількість предметів на рядок у вигляді підземель JEI
    I:itemsPerRow=4

    # Головним чином для розробників пакунків. Містить такі функції, як середня кількість блоків на чанк, ідентифікатори сутностей тощо.
    B:showDevData=false
}


