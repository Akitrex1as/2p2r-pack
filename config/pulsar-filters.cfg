# Pulsar RGB filters
# Minimum absorption: 0 adds no absorption; 15 blocks the component.
# Use /pulsar reload to apply both palettes, or restart. User overrides take precedence over built-in/mod registrations.
# Later lines override earlier lines. These files are not reset by the main config version.
# Format: namespace:block[property=value,...] = red, green, blue (0..15).
# Omit properties to match all states; namespace:block:meta also matches legacy metadata.
# minecraft:stained_glass[color=red] = 0, 15, 15
